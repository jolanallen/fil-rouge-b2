services:
  mariadb:
    image: mariadb:11
    container_name: yplaza-db
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: immoapp
      MARIADB_USER: immopredict
      MARIADB_PASSWORD: immopredict
    ports:
      - '3307:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./app/immopredict/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yplaza-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  immopredict:
    build:
      context: ./app/immopredict
      dockerfile: DOCKERFILE
      target: prod
    environment:
      DATABASE_URL: mysql+pymysql://immopredict:immopredict@mariadb:3306/immoapp
      DVF_API_BASE_URL: https://files.data.gouv.fr/geo-dvf/latest/csv
      LOG_LEVEL: INFO
    ports:
      - '8000:8000'
    depends_on:
      mariadb:
        condition: service_healthy
    restart: on-failure

  immobackend:
    build:
      context: ./app/immoapp/immobackend
      dockerfile: Dockerfile
    env_file:
      - ./app/immoapp/immobackend/.env
    ports:
      - '3001:3001'
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  immofront:
    build:
      context: ./app/immoapp/immofront
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://192.168.10.10:3001/api/v1
        VITE_CDN_BASE_URL: http://192.168.10.10:3001
    ports:
      - '3002:80'
    depends_on:
      - immobackend

volumes:
  mariadb_data:

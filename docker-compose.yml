services:
  mariadb:
    image: mariadb:11
    container_name: yplaza-db
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: immoapp
      MARIADB_USER: immopredict
      MARIADB_PASSWORD: immopredict
    ports:
      - '3307:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./app/immopredict/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yplaza-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  immopredict:
    build:
      context: ./app/immopredict
      dockerfile: DOCKERFILE
      target: prod
    environment:
      DATABASE_URL: mysql+pymysql://immopredict:immopredict@mariadb:3306/immoapp
      DVF_API_BASE_URL: https://files.data.gouv.fr/geo-dvf/latest/csv
      LOG_LEVEL: INFO
    ports:
      - '8000:8000'
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - immoback_cdn:/app/uploads
    restart: on-failure

  immobackend:
    build:
      context: ./app/immoapp/immobackend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: immopredict
      DB_PASSWORD: immopredict
      DB_NAME: immoapp
      REDIS_HOST: yplaza-redis
      REDIS_PORT: 6379
      JWT_SECRET: change-me-in-production
      IMMOPREDICT_API_URL: http://immopredict:8000/api/v1
      CORS_ORIGINS: http://localhost:3002,http://localhost:5173,http://localhost:4173
    env_file:
      - ./app/immoapp/immobackend/.env
    ports:
      - '3001:3001'
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  immofront:
    build:
      context: ./app/immoapp/immofront
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3001/api/v1
        VITE_CDN_BASE_URL: http://localhost:3001
    ports:
      - '3002:80'
    depends_on:
      - immobackend

volumes:
  mariadb_data:
  immoback_cdn:

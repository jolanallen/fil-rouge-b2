services:
  mariadb:
    image: mariadb:11
    container_name: immopredict-db
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: immoapp
      MARIADB_USER: immopredict
      MARIADB_PASSWORD: immopredict
    ports:
      - '3307:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: DOCKERFILE
      target: prod
    container_name: immopredict-api
    environment:
      DATABASE_URL: mysql+pymysql://immopredict:immopredict@mariadb:3306/immoapp
      DVF_API_BASE_URL: https://files.data.gouv.fr/geo-dvf/latest/csv
      LOG_LEVEL: INFO
    ports:
      - '8000:8000'
    depends_on:
      mariadb:
        condition: service_healthy
    restart: on-failure

volumes:
  mariadb_data:
